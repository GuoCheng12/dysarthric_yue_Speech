    sha256:
      manifest: 7bf5cc077f5a4e0789196e5fcf17959efcb0eeef94ccfc00b061ec5e481dc9a8
      train: 6d232f763e065f2bacea234a483948ec790a16354cfb5d76732453c1bfd31be8
      dev: 978c9537352f3725d0019a0329f5533d5900e9dfc74af472ee05032eab38ec4d
      test: c150f7f7d8380901727a45dfa5481137d2a2ead823c01e08f11b3389e9aee543
    audit_policy: Frozen QC audit and all four content-identity overlap checks must pass.
    test_policy: >
