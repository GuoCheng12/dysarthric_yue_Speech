agent:
  provider: OpenAI
  base_url: https://api.laicaishare.xyz
  model: gpt-5.6-sol
  reasoning_effort: xhigh
  store: false
  max_retries: 0
  timeout_seconds: 900
  max_output_tokens: 32768
  api_key_env: OPENAI_API_KEY

# These three budgets are draft research choices. Freeze them before `init`.
synthetic_count_per_round: 480
unique_stimulus_count_per_round: 60
real_replay_count_per_round: 2117
speaker_profiles:
  all_patients_balanced:
    difficulty_groups: [easy, medium, hard]
proposal_constraints:
  # Agent v1 keeps CosyVoice reference allocation outside the Agent.
  fixed_speaker_profile_id: all_patients_balanced
  # Keep the first protocol causally interpretable: one intervention target/round.
  max_primary_targets: 1
  max_copies_per_stimulus: 16
  max_surface_characters_per_stimulus: 24
  # An exactly-threshold-supported target remains an exploratory intervention.
  threshold_edge_max_linked_copies: 16
  threshold_edge_max_unique_stimuli: 2
  threshold_edge_max_carrier_exposures: 32
  # Diagnostic-only clusters may inform assessment/risk, never TTS text.
  non_targetable_cluster_stimuli_allowed: false
  non_tts_actionable_cluster_stimuli_allowed: false

lora:
  rank: 16
  alpha: 4
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  learning_rate: 0.0002
  per_device_batch_size: 1
  gradient_accumulation_steps: 32
  world_size: 1
  # ceil((2117 real + 480 synthetic) / 32) = 82: one manifest pass.
  optimizer_steps_per_round: 82
  training_passes_per_round: 1
  save_at_round_end: true
  scheduler: linear
  initialization: parent_adapter_weights_only
  reset_optimizer_each_round: true
  reset_scheduler_each_round: true
  warmup_ratio: 0.02
  seed: 42

evaluation:
  language: Cantonese
  batch_size: 8
  critical_cer_threshold: 0.5
  metrics:
    - mean_utterance_cer
    - pooled_cer
    - patient_macro_cer
    - critical_count
    - exact_count

skill_update_rounds:
  - 2
